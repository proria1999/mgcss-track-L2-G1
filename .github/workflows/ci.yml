name: Java CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
        
      # Aseguramos los permisos del archivo para evitar bloqueos en Linux
      - name: Dar permisos de ejecucion a mvnw
        run: chmod +x mvnw

    # Compilación y Análisis asegurando la inyección directa del Token
      - name: Build and verify with Maven 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=proria1999 \
            -Dsonar.projectKey=proria1999_mgcss-track-L2-G1 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
