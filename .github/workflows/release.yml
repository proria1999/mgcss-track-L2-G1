name: CD Release Pipeline

# El pipeline se activa ÚNICAMENTE al hacer push de un tag que empiece por 'v' (ej. v1.1.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Hacer checkout del código fuente
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Esencial para que SonarQube analice el histórico de commits

      # 2. Configurar el entorno de Java
      - name: Configurar JDK 17
        uses: actions/setup-java@61081a333c893d6930a36d90a54053fa2c4ed374 # v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # FASE 5: Control de calidad antes de la release (Quality Gate)
      # Forzamos a Sonar a asociar el Tag con 'main' para que no falle por HEAD descodificado
      - name: Ejecutar Tests y Análisis de SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw verify sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.branch.name=main

      # FASE 3: Compilar el proyecto y generar el artefacto .jar ejecutable
      - name: Generar artefacto ejecutable (.jar)
        run: ./mvnw package -DskipTests

      # FASE 3 (Paso 3.2): Construir la imagen Docker utilizando el tag como versión
      - name: Construir Imagen Docker
        run: |
          docker build -t mgcss-track:${{ github.ref_name }} .

      # FASE 3: Publicar la Release automáticamente en GitHub y adjuntar el .jar
      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@c95fe1489396fe8a218714604add9b06f1e6129a # v2.0.4
        with:
          files: target/*.jar # Adjunta el .jar generado como asset de la release
          generate_release_notes: true # Autogenera el apartado de notas basándose en commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
