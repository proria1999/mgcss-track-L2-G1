name: Release pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Dar permisos de ejecucion a mvnw
        run: chmod +x mvnw

      # FASE 5 y FASE 3 UNIFICADAS: Compila, prueba, genera artefacto y pasa el Quality Gate en un solo paso
      - name: Ejecutar Tests, Compilación y Análisis de SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=proria1999 \
            -Dsonar.projectKey=proria1999_mgcss-track-L2-G1 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true

      # FASE 3: Renombrar el artefacto (ya generado en el paso anterior, no hace falta recompilar)
      - name: Rename artifact
        run: |
          cp target/*.jar target/app-${{ github.ref_name }}.jar

      # FASE 3: Construir la imagen Docker (Obligatorio)
      - name: Construir Imagen Docker
        run: |
          docker build -t mgcss-track:${{ github.ref_name }} .

      # FASE 3: Publicar la Release en GitHub adjuntando el Asset
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: target/app-${{ github.ref_name }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
